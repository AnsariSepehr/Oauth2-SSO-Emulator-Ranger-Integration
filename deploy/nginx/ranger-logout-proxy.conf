# EXPERIMENTAL / NOT VERIFIED AGAINST A LIVE RANGER - read before using.
#
# Problem: Ranger's "Log Out" button only destroys Ranger's own session
# (RANGERADMINSESSIONID). The SSO cookie (hadoop-jwt, Domain=.example.com) stays
# valid, so the next request silently logs the user straight back in.
#
# Idea: put nginx in front of Ranger and, when the logout request passes
# through, ALSO expire the hadoop-jwt cookie (same Domain/Path as when it was
# set - otherwise the browser ignores the deletion).
#
# BEFORE USING: open Ranger, DevTools -> Network, click "Log Out" and confirm
# the exact method + path of the request. The location below assumes "/logout"
# (Spring Security default) - adjust it if yours differs.
#
# Deployment note: users must reach Ranger THROUGH nginx. Either move Ranger's
# own port (ranger.service.http.port, e.g. 6081 and update ranger.externalurl +
# usersync/plugin URLs that point at :6080) and let nginx listen on :6080, or
# serve Ranger on port 80/443 via nginx and use that origin in
# RANGER_ALLOWED_ORIGINS.

server {
    listen 80;
    server_name ranger.example.com;

    location = /logout {
        proxy_pass         http://127.0.0.1:6080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Set-Cookie "hadoop-jwt=; Domain=.example.com; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:6080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
