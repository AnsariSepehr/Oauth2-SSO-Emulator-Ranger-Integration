# /etc/nginx/conf.d/sso.conf  -- reverse proxy for the SSO (HTTP first).
# Both hostnames are served by the same Node process (port 5205); the split only
# mirrors the Issuer/API host split of the modelled SSO.
#
# Rocky Linux / SELinux: nginx may not connect to a backend port until you run
#   sudo setsebool -P httpd_can_network_connect 1
# firewalld:
#   sudo firewall-cmd --permanent --add-service=http --add-service=https && sudo firewall-cmd --reload

server {
    listen 80;
    server_name sso.example.com api.sso.example.com;

    location / {
        proxy_pass         http://127.0.0.1:5205;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

